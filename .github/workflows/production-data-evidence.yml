name: production-data-evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  codex-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Capture complete BDO Codex KR Cooking/Alchemy catalogs
        run: npm run data:codex:browser -- --out artifacts/codex-catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: codex-catalog
          path: artifacts/codex-catalog.json
          if-no-files-found: error
          retention-days: 14
