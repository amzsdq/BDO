name: production-data-evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'scripts/collect-production-web-evidence.mjs'
      - 'scripts/collect-codex-catalog-browser.mjs'
      - 'scripts/collect-reviewed-codex-recipe-details.mjs'
      - 'scripts/collect-codex-recipe-details.mjs'
      - 'scripts/reviewed-retired-route-state.mjs'
      - 'scripts/collect-codex-item-evidence.mjs'
      - 'scripts/codex-material-group-ids.mjs'
      - 'scripts/collect-codex-substitution-groups.mjs'
      - 'scripts/codex-catalog-endpoint.mjs'
      - 'scripts/codex-id-evidence.mjs'
      - 'data/evidence/retired-crafting-routes.kr.json'
      - 'package.json'
      - '.github/workflows/production-data-evidence.yml'

permissions:
  contents: read

jobs:
  lockfile-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'relay/variant-yield-turn80'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when missing or changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already reproducible"
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  production-web-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm install
      - name: Upload generated lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npx playwright install --with-deps chromium
      - name: Capture reviewed BDO Codex KR production web evidence
        run: npm run data:web:evidence -- --out-dir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: production-web-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
